# Release de CARRONA: al pushear un tag vX.Y.Z (o a mano) arma dist/, compila el
# instalador con Inno Setup (viene en windows-latest) y publica el .exe y el zip
# portable como artefactos y, en los tags, como release de GitHub.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: El tag tiene que coincidir con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { Write-Error "package.json dice $v y el tag es ${{ github.ref_name }}"; exit 1 }

      - name: Íconos
        run: node tools/icons.mjs

      - name: Pruebas
        run: npm test

      - name: Build (dist, sw.js, zip portable, version.iss)
        run: node tools/build.mjs

      - name: Prueba del build
        run: node test/t_build.mjs

      - name: Instalador (Inno Setup 6)
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\carrona.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: CARRONA-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Release de GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -Include *.exe, *.zip -Recurse | ForEach-Object { $_.FullName })
          gh release create "${{ github.ref_name }}" @files --title "CARRONA ${{ github.ref_name }}" --generate-notes
